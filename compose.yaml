services:
  server:
    build:
      context: .
      target: final
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    container_name: db_dev
    restart: always
    environment:
      POSTGRES_PASSWORD: core2026
      POSTGRES_DB: defaultdb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10


  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /source
    command: dotnet test --logger "console;verbosity=detailed"
volumes:
  pgdata:
