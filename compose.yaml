services:
  server:
    build:
      context: .
      target: final
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: postgres
    container_name: db_dev
    restart: always
    environment:
      POSTGRES_PASSWORD: core2026
      POSTGRES_DB: defaultdb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10


  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /source
    command: dotnet test
    env_file:
      - .env
    # Integration tests start Postgres with Testcontainers, which needs the host daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - label=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"

volumes:
  pgdata:
