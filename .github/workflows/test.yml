name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Run tests with coverage
        run: dotnet test --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Filter coverage to src C# files
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET

          for filename in glob.glob("coverage/**/coverage.cobertura.xml", recursive=True):
              tree = ET.parse(filename)
              root = tree.getroot()

              for package in root.findall(".//package"):
                  for cls in list(package.findall("./classes/class")):
                      source_file = cls.get("filename", "").replace("\\", "/")

                      if not source_file.endswith(".cs") or not (
                          source_file.startswith("src/")
                          or "/src/" in source_file
                      ):
                          package.find("./classes").remove(cls)

              tree.write(filename, encoding="utf-8", xml_declaration=True)

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "60 80"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
