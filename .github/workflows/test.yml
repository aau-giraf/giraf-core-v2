name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate Per-File Coverage Report
        shell: pwsh
        run: |
          [xml]$xml = Get-Content (Get-ChildItem ./coverage -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1).FullName

          $results = @{}

          foreach ($class in $xml.SelectNodes("//class[@filename]")) {
            $path = $class.GetAttribute("filename") -replace '\\', '/'

            # Ignore files in any Migrations folder
            if ($path -match '(^|/)Migrations/') {
              continue
            }

            if (-not $path.EndsWith(".cs")) {
              continue
            }

            $lines = $class.SelectNodes("./lines/line")
            $total = $lines.Count
            $covered = @($lines | Where-Object {
              [int]$_.GetAttribute("hits") -gt 0
            }).Count

            if (-not $results.ContainsKey($path)) {
              $results[$path] = @{ Covered = 0; Total = 0 }
            }

            $results[$path].Covered += $covered
            $results[$path].Total += $total
            }

          $markdown = @(
            "## Code Coverage by C# File"
            ""
            "| File | Coverage | Covered / Total |"
            "|---|---:|---:|"
          )

          foreach ($path in ($results.Keys | Sort-Object)) {
            $item = $results[$path]
            $percent = if ($item.Total -gt 0) {
              [math]::Round(100 * $item.Covered / $item.Total, 2)
            } else { 0 }

            $markdown += "| ``$path`` | $percent% | $($item.Covered) / $($item.Total) |"
            }

          $markdown | Set-Content code-coverage-results.md

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
