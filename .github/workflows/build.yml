name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - run: dotnet restore
    - run: dotnet build --no-restore --configuration Release
    - uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          **/bin/Release/**
          **/obj/Release/**
